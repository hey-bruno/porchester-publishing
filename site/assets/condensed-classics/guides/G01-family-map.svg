<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-labelledby="title desc"><title id="title">Editorial relationship map: three families</title><desc id="desc">Selected family relationships at the end of the opening section. The accompanying HTML supplies a complete linear equivalent.</desc><rect width="800" height="1020" fill="#fffdf7"/><g fill="#754000" font-family="Georgia, serif">
<text x="45" y="48" font-size="19" text-anchor="start">EDITORIAL GUIDE 01</text>
<text x="45" y="88" font-size="34" text-anchor="start">Three family circles</text>
<text x="45" y="130" font-size="23" text-anchor="start">Rostóv</text>
<rect x="215" y="155" width="370" height="70" rx="7" fill="none" stroke="#754000" stroke-width="2"/>
<text x="400.0" y="184" font-size="23" text-anchor="middle">Count and Countess Rostóv</text>
<text x="400.0" y="209" font-size="18" text-anchor="middle">parents of the three children below</text>
<path d="M400 225 L400 245" stroke="#754000" stroke-width="2" fill="none"/>
