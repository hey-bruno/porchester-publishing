<rect x="300" y="265" width="200" height="70" rx="7" fill="none" stroke="#754000" stroke-width="2"/>
<text x="400.0" y="294" font-size="23" text-anchor="middle">Natásha</text>
<rect x="555" y="265" width="200" height="70" rx="7" fill="none" stroke="#754000" stroke-width="2"/>
