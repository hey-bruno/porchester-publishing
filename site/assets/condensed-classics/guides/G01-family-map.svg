<text x="232" y="662" font-size="19" text-anchor="start">married</text>
<rect x="95" y="678" width="230" height="70" rx="7" fill="none" stroke="#754000" stroke-width="2"/>
<text x="210.0" y="707" font-size="23" text-anchor="middle">Lise</text>
