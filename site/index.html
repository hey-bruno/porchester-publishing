<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porchester Publishing</title>
<meta name="description" content="Porchester Publishing, London.">
<style>
  :root { --ink: #1a1a1a; --paper: #f7f5f0; --muted: #6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161616; --muted: #9a9a9a; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, "Times New Roman", serif; padding: 0 16px; }
  main { text-align: center; }
  h1 { font-weight: normal; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: 0.02em; margin: 0; }
  p { color: var(--muted); font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; margin: 1rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>Porchester Publishing</h1>
  <p>London</p>
</main>
</body>
</html>
